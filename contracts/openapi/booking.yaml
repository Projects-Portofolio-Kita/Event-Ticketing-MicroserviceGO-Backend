openapi: 3.0.3
info:
  title: TickId Booking Service API
  version: 1.1.0
  description: |
    Kontrak API booking-service (Go + Gin, port 8083) — reservasi tiket.

    Sumber kebenaran: route di
    `services/booking-service/cmd/server/main.go`,
    `internal/dto/reservation_request.go`, `internal/dto/reservation_response.go`,
    `internal/handler/reservation_handler.go`, dan `internal/model/reservation.go`.

    Prefix `/api/v1` untuk endpoint bisnis, `/health` untuk liveness.

    Dua mode reservasi (`mode`), mengikuti `saleMode` event di catalog-service:
    - `SEATED` — lock kursi bernomor dari denah; klien mengirim baris `seats`.
    - `TIER` — tiket berbasis kuota (VIP/VVIP/Regular/kustom); klien hanya
      mengirim `categoryId` + `quantity`. Nama, harga, dan kuota diambil dari
      catalog-service (`GET /events/:id/tier-quotas`, `X-Service-Token`) —
      klien tidak pernah menentukan harga. Kuota dicek di dalam transaksi
      dengan advisory lock per tier, sehingga pembeli paralel tidak bisa
      oversell; maksimal 10 tiket per reservasi.

    Catatan auth (identitas SELALU dari token, bukan body):
    - `POST /api/v1/reservations`, `GET /api/v1/reservations` — user login
      (`Authorization: Bearer <access token>`). Field `userId` di body diterima
      untuk kompatibilitas tetapi DIABAIKAN.
    - `GET /reservations/:id`, `confirm`, `cancel` — pemilik ATAU service
      (`X-Service-Token`, dipakai payment-service). Service enforces kepemilikan.
    - `GET /events/:eventId/seat-status` dan `ticket-status` — hanya
      `X-Service-Token` (dikonsumsi catalog-service; gateway menghapus header
      itu dari trafik publik).

    TTL reservasi 5 menit (`reservationTTL`), status awal `LOCKED`.
    Error selalu `{"message": string}`.
servers:
  - url: http://localhost:8083
    description: booking-service lokal
tags:
  - name: Health
    description: Liveness probe
  - name: Reservations
    description: Pembuatan dan pengelolaan reservasi (kursi atau tiket berkuota)
  - name: Availability
    description: Feed ketersediaan (kursi + tiket) untuk catalog-service
paths:
  /health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Health check
      responses:
        "200":
          description: Service aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/reservations:
    post:
      tags: [Reservations]
      operationId: createReservation
      summary: Buat reservasi (lock kursi atau tiket)
      description: |
        Membuat reservasi untuk user yang sedang login. `mode` diambil dari
        payload bila diisi, kalau kosong disimpulkan dari isi (ada `items` →
        `TIER`, selain itu `SEATED`); mode selalu divalidasi terhadap
        isinya, jadi baris kursi dan baris tiket tidak bisa tercampur.

        Pemilik diambil dari token, bukan dari body.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
      responses:
        "201":
          description: Reservasi dibuat dengan status `LOCKED`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "400":
          description: |
            Input tidak valid (UUID salah / minimal satu baris / `mode` tidak
            dikenal / `mode` tidak cocok dengan isi / kuantitas di luar 1..10)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Tanpa/invalid access token (atau `X-Service-Token` tidak cocok)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Event tidak ditemukan di catalog-service (`ErrEventNotFound`, mode TIER)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            Kursi sudah di-lock/terjual (`ErrSeatsUnavailable`) ATAU kuota
            tiket habis / tier tidak dijual di event ini
            (`ErrTicketsUnavailable`) — pesan menyebut sisa kuota per tier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [Reservations]
      operationId: listReservations
      summary: Daftar reservasi milik pemanggil ("Tiket Saya")
      description: |
        Reservasi milik user yang sedang login, terbaru dulu, lengkap dengan
        baris kursi maupun baris tiket. Pemilik diambil dari token.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Jumlah maksimum (default 20, maksimum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Daftar reservasi milik pemanggil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationListResponse"
        "400":
          description: Token tidak punya subject user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Tanpa/invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/reservations/{id}:
    get:
      tags: [Reservations]
      operationId: getReservation
      summary: Ambil reservasi by ID (pemilik atau service)
      security:
        - bearerAuth: []
        - serviceToken: []
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: Detail reservasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "403":
          description: Pemanggil bukan pemilik reservasi (`ErrForbidden`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Reservasi tidak ditemukan atau ID bukan UUID valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/reservations/{id}/confirm:
    post:
      tags: [Reservations]
      operationId: confirmReservation
      summary: Konfirmasi reservasi (LOCKED -> CONFIRMED)
      description: |
        Dipanggil payment-service setelah pembayaran sukses
        (dengan `X-Service-Token`) — pemilik juga boleh. Bila reservasi bukan
        `LOCKED` atau sudah lewat `expiresAt`, mengembalikan 400 (reservasi
        yang lewat tempo diubah menjadi `EXPIRED`).
      security:
        - bearerAuth: []
        - serviceToken: []
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: Reservasi terkonfirmasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "400":
          description: Status bukan LOCKED, sudah kedaluwarsa, atau ID tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Reservasi tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/reservations/{id}/cancel:
    post:
      tags: [Reservations]
      operationId: cancelReservation
      summary: Batalkan reservasi (-> CANCELLED)
      description: |
        Melepas lock: kursi/tiket kembali tersedia. Kursi yang lewat tempo juga
        bebas dibaca ulang oleh feed ketersediaan (status `EXPIRED` tidak lagi
        dihitung).
      security:
        - bearerAuth: []
        - serviceToken: []
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: Reservasi dibatalkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "400":
          description: Reservasi sudah CONFIRMED atau ID tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Reservasi tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/events/{eventId}/seat-status:
    get:
      tags: [Availability]
      operationId: getEventSeatStatus
      summary: Kursi terkunci/terjual untuk satu event (service-to-service)
      description: |
        Hanya kursi dari reservasi berstatus `LOCKED` (masih berlaku) atau
        `CONFIRMED`. Dipakai catalog-service untuk menentukan
        `available | locked | sold`. Butuh `X-Service-Token`.
      security:
        - serviceToken: []
      parameters:
        - name: eventId
          in: path
          required: true
          description: Event ID (UUID).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Daftar status kursi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatStatusListResponse"
        "400":
          description: '`eventId` bukan UUID valid'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Tanpa/invalid `X-Service-Token`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/events/{eventId}/ticket-status:
    get:
      tags: [Availability]
      operationId: getEventTicketStatus
      summary: Jumlah tiket terkunci/terjual per tier (service-to-service)
      description: |
        Menjumlahkan `reservation_items.quantity` untuk reservasi `LOCKED`
        (masih berlaku) atau `CONFIRMED`, dikelompokkan per `categoryId`.
        Dipakai catalog-service menghitung `remaining` pada
        `GET /events/{id}/ticket-types`. Butuh `X-Service-Token`.
      security:
        - serviceToken: []
      parameters:
        - name: eventId
          in: path
          required: true
          description: Event ID (UUID).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Jumlah tiket terkunci/terjual per tier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketStatusListResponse"
        "400":
          description: '`eventId` bukan UUID valid'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Tanpa/invalid `X-Service-Token`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token JWT (HS256) hasil `POST /api/v1/auth/login` dsb.
        Pemilik reservasi ditentukan oleh subject token.
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: |
        Token internal bersama antar-service (env `SERVICE_TOKEN`).
        Dihapus gateway untuk trafik publik — hanya dipakai service-to-service.
  parameters:
    ReservationId:
      name: id
      in: path
      required: true
      description: Reservation ID (UUID).
      schema:
        type: string
        format: uuid
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: booking-service
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    CreateReservationRequest:
      type: object
      required: [eventId]
      properties:
        userId:
          type: string
          format: uuid
          description: |
            DIABAIKAN (kompatibilitas mundur). Pemilik diambil dari
            `Authorization: Bearer <access token>`.
        eventId:
          type: string
          format: uuid
        mode:
          type: string
          maxLength: 10
          enum: [SEATED, TIER]
          description: |
            Opsional. Kosong = disimpulkan dari isi (`items` → TIER, selain itu
            SEATED). Bila diisi, wajib cocok dengan isi payload: `SEATED`
            butuh `seats`, `TIER` butuh `items`.
          example: TIER
        seats:
          type: array
          description: Baris kursi (wajib untuk mode SEATED, kosong untuk TIER).
          items:
            $ref: "#/components/schemas/SeatItemRequest"
        items:
          type: array
          description: |
            Baris tiket (wajib untuk mode TIER, kosong untuk SEATED).
            Baris dengan `categoryId` sama otomatis digabung; total kuantitas
            maksimal 10 per reservasi.
          items:
            $ref: "#/components/schemas/TicketItemRequest"
        currency:
          type: string
          description: Kosong = `IDR`.
          default: IDR
          example: IDR
    SeatItemRequest:
      type: object
      required: [seatId, section, row, number, price]
      properties:
        seatId:
          type: string
          format: uuid
        section:
          type: string
          description: Nama kategori kursi.
        row:
          type: string
        number:
          type: string
          description: Nomor kursi (string, sesuai `ReservationSeat.Number`).
        price:
          type: number
          format: double
          description: |
            Harga yang dirender klien (informatif untuk mode SEATED).
            Untuk TIER, harga SELALU dari catalog-service.
    TicketItemRequest:
      type: object
      required: [categoryId, quantity]
      properties:
        categoryId:
          type: string
          format: uuid
          description: Tier/kategori tiket (dari `GET /events/{id}/ticket-types`).
        quantity:
          type: integer
          minimum: 1
          maximum: 10
          example: 2
    ReservationListResponse:
      type: object
      required: [reservations]
      properties:
        reservations:
          type: array
          items:
            $ref: "#/components/schemas/ReservationResponse"
    ReservationResponse:
      type: object
      required:
        - reservationId
        - userId
        - eventId
        - bookingRef
        - status
        - mode
        - expiresAt
        - totalAmount
        - currency
        - seats
        - items
        - createdAt
      properties:
        reservationId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        bookingRef:
          type: string
          example: TICK-1735689600-0421
        status:
          type: string
          enum: [LOCKED, CONFIRMED, EXPIRED, CANCELLED]
        mode:
          type: string
          enum: [SEATED, TIER]
          description: |
            SEATED → `seats` terisi, `items` kosong. TIER → `items` terisi,
            `seats` kosong. Nilai lama yang kosong dibaca sebagai `SEATED`.
        expiresAt:
          type: string
          format: date-time
        totalAmount:
          type: number
          format: double
          description: Jumlah yang harus dibayar (server menghitung dari harga katalog).
        currency:
          type: string
          example: IDR
        seats:
          type: array
          description: Kursi terkunci (mode SEATED).
          items:
            $ref: "#/components/schemas/SeatItemResponse"
        items:
          type: array
          description: Tiket terkunci per tier (mode TIER).
          items:
            $ref: "#/components/schemas/TicketItemResponse"
        createdAt:
          type: string
          format: date-time
    SeatItemResponse:
      type: object
      required: [seatId, section, row, number, price]
      properties:
        seatId:
          type: string
          format: uuid
        section:
          type: string
        row:
          type: string
        number:
          type: string
        price:
          type: number
          format: double
    TicketItemResponse:
      type: object
      required: [categoryId, categoryName, quantity, unitPrice, subtotal]
      properties:
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
          example: VIP
        quantity:
          type: integer
          example: 2
        unitPrice:
          type: number
          format: double
          description: Harga per tiket menurut catalog-service.
          example: 750000
        subtotal:
          type: number
          format: double
          example: 1500000
    SeatStatusListResponse:
      type: object
      required: [seats]
      properties:
        seats:
          type: array
          items:
            $ref: "#/components/schemas/SeatStatusResponse"
    SeatStatusResponse:
      type: object
      required: [seatId, status]
      properties:
        seatId:
          type: string
          format: uuid
        status:
          type: string
          description: Status reservasi pemilik kursi (`LOCKED` atau `CONFIRMED`).
          enum: [LOCKED, CONFIRMED]
    TicketStatusListResponse:
      type: object
      required: [tickets]
      properties:
        tickets:
          type: array
          items:
            $ref: "#/components/schemas/TicketStatusResponse"
    TicketStatusResponse:
      type: object
      required: [categoryId, reserved]
      properties:
        categoryId:
          type: string
          format: uuid
        reserved:
          type: integer
          description: Jumlah tiket tier ini yang terkunci/terjual.
          example: 108
